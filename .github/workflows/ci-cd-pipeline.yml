name: RTGS offline invariant tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m py_compile rtgs_gate.py tests/test_rtgs_gate.py tests/reality_check_harness.py
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust unit tests (no dependencies/network)
        run: cargo test --offline
